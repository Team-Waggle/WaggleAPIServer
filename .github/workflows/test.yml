name: Test

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    if: github.repository == 'Team-Waggle/WaggleAPIServer'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test

      # 실패한 테스트를 로그에서 찾지 않도록 리포트를 아티팩트로 남김
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
